version: '3.8'

services:
  obsidian:
    image: sytone/obsidian-remote:latest
    container_name: sleepmon_obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./vault:/vault:rw
      - ./config/obsidian:/config:rw
    ports:
      - "8080:8080" # VNC access for initial setup
      - "27124:27124" # Local REST API
    restart: unless-stopped

  app:
    build: ./app
    container_name: sleepmon_app
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Moscow
    env_file:
      - .env
    depends_on:
      - obsidian
    restart: unless-stopped
