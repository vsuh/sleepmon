<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Monitor — {{ date }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 title="Данные о сне, пульсе и шагах приходят автоматически с телефона. Здесь можно проверить, поправить значения и сохранить.">Дневник самочувствия</h1>
                <a href="/api/storage/sync" class="storage-sync-link" title="Запустить синхронизацию SQLite и Obsidian">Синхронизировать хранилища</a>
            </div>
            <div class="header-links">
                <a href="/history" class="btn-outline">Сводка за 15 дней</a>
                <a href="/logout" class="btn-outline">Выход</a>
            </div>
        </header>

        <form action="/save" method="post" class="data-form">
            <input type="hidden" name="date" value="{{ date }}">

            <input type="hidden" name="original_sleep_hours" value="{{ data.sleep_hours }}">
            <input type="hidden" name="original_pulse_avg_day" value="{{ data.pulse_avg_day }}">
            <input type="hidden" name="original_pulse_avg_sleep" value="{{ data.pulse_avg_sleep }}">
            <input type="hidden" name="original_steps_total" value="{{ data.steps_total }}">
            <input type="hidden" name="original_sleep_awakenings" value="{{ data.sleep_awakenings|default(0) }}">
            <input type="hidden" name="original_well_being" value="{{ data.well_being }}">
            <input type="hidden" name="original_sleep_quality" value="{{ data.sleep_quality }}">
            <input type="hidden" name="original_alco" value="{{ 'true' if data.alco else 'false' }}">
            <input type="hidden" name="original_notes" value="{{ data.notes }}">

            <div class="date-nav">
                <button type="submit" name="navigate" value="prev" class="date-nav-button" title="Назад" aria-label="Назад">
                    <span aria-hidden="true">‹</span>
                </button>

                <div class="date-current" title="Текущая дата: {{ date }}">
                    {{ date_label|default(date) }}
                </div>

                <button type="submit" name="navigate" value="next" class="date-nav-button" title="Вперед" aria-label="Вперед">
                    <span aria-hidden="true">›</span>
                </button>

                <button type="submit" name="navigate" value="today" class="date-nav-button today-nav-button" title="Сегодня" aria-label="Сегодня">
                    <span aria-hidden="true">◴</span>
                </button>
            </div>

            <div class="form-group">
                <label>Сон (часов):</label>
                <input type="number" step="0.1" name="sleep_hours" value="{{ data.sleep_hours }}">
            </div>

            <div class="form-group">
                <label>Как спалось? (0-9):</label>
                <div class="range-control">
                    <input type="range" name="sleep_quality" min="0" max="9" value="{{ data.sleep_quality|default(9) }}">
                    <span class="range-grip" aria-hidden="true"></span>
                </div>
                <output>{{ data.sleep_quality|default(9) }}</output>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пульс (день):</label>
                    <input type="number" name="pulse_avg_day" value="{{ data.pulse_avg_day }}">
                </div>
                <div class="form-group">
                    <label>Пульс (сон):</label>
                    <input type="number" name="pulse_avg_sleep" value="{{ data.pulse_avg_sleep }}">
                </div>
            </div>

            <div class="form-group">
                <label>Шаги за день:</label>
                <input type="number" name="steps_total" value="{{ data.steps_total }}">
            </div>

            <div class="form-group">
                <label>Вставал (раз):</label>
                <input type="number" name="sleep_awakenings" value="{{ data.sleep_awakenings|default(0) }}">
            </div>

            <div class="form-group">
                <label>Самочувствие (0-9):</label>
                <div class="range-control">
                    <input type="range" name="well_being" min="0" max="9" value="{{ data.well_being|default(9) }}">
                    <span class="range-grip" aria-hidden="true"></span>
                </div>
                <output>{{ data.well_being|default(9) }}</output>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="alco" value="true" {% if data.alco %}checked{% endif %}>
                    Был ли алкоголь?
                </label>
            </div>

            <div class="form-group">
                <label>Заметки:</label>
                <textarea name="notes" rows="5">{{ data.notes }}</textarea>
            </div>

            <button type="submit" name="navigate" value="save" class="btn-save">Сохранить</button>
        </form>
    </div>

    <script>
    // Sliders change only when the thumb itself is grabbed: the native <input type="range">
    // ignores pointer events (see style.css) and a grip that follows the thumb drives it,
    // so a swipe that merely starts on the slider scrolls the page and changes nothing.
    (function () {
        var THUMB = 20; // thumb width in px, keep in sync with style.css
        document.querySelectorAll('.range-control').forEach(function (box) {
            var input = box.querySelector('input[type="range"]');
            var grip = box.querySelector('.range-grip');
            var output = box.nextElementSibling;
            var grabOffset = 0;

            function range() {
                return { min: Number(input.min), max: Number(input.max), step: Number(input.step) || 1 };
            }

            function thumbCenter(rect) {
                var r = range();
                var fraction = r.max > r.min ? (Number(input.value) - r.min) / (r.max - r.min) : 0;
                return rect.left + THUMB / 2 + fraction * (rect.width - THUMB);
            }

            function sync() {
                var rect = input.getBoundingClientRect();
                grip.style.left = (thumbCenter(rect) - rect.left) + 'px';
                if (output) { output.value = input.value; }
            }

            function moveTo(clientX) {
                var rect = input.getBoundingClientRect();
                var r = range();
                var fraction = (clientX - grabOffset - rect.left - THUMB / 2) / (rect.width - THUMB);
                fraction = Math.max(0, Math.min(1, fraction));
                var value = r.min + Math.round(fraction * (r.max - r.min) / r.step) * r.step;
                if (String(value) !== input.value) {
                    input.value = value;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            grip.addEventListener('pointerdown', function (e) {
                grabOffset = e.clientX - thumbCenter(input.getBoundingClientRect());
                grip.setPointerCapture(e.pointerId);
                box.classList.add('is-dragging');
                e.preventDefault();
            });
            grip.addEventListener('pointermove', function (e) {
                if (grip.hasPointerCapture(e.pointerId)) { moveTo(e.clientX); }
            });
            ['pointerup', 'pointercancel'].forEach(function (name) {
                grip.addEventListener(name, function () { box.classList.remove('is-dragging'); });
            });

            input.addEventListener('input', sync);
            window.addEventListener('resize', sync);
            sync();
        });
    })();
    </script>
</body>
</html>
