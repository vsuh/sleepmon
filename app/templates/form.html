<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Monitor — {{ date }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 title="Данные о сне, пульсе и шагах приходят автоматически с телефона. Здесь можно проверить, поправить значения и сохранить.">Дневник самочувствия</h1>
            <div class="header-links">
                <a href="/logout" class="btn-outline">Выход</a>
            </div>
        </header>

        <form action="/save" method="post" class="data-form">
            <input type="hidden" name="date" value="{{ date }}">

            <input type="hidden" name="original_sleep_hours" value="{{ data.sleep_hours }}">
            <input type="hidden" name="original_pulse_avg_day" value="{{ data.pulse_avg_day }}">
            <input type="hidden" name="original_pulse_avg_sleep" value="{{ data.pulse_avg_sleep }}">
            <input type="hidden" name="original_steps_total" value="{{ data.steps_total }}">
            <input type="hidden" name="original_well_being" value="{{ data.well_being }}">
            <input type="hidden" name="original_sleep_quality" value="{{ data.sleep_quality }}">
            <input type="hidden" name="original_alco" value="{{ 'true' if data.alco else 'false' }}">
            <input type="hidden" name="original_notes" value="{{ data.notes }}">

            <div class="date-nav">
                <button type="submit" name="navigate" value="prev" class="date-nav-button" title="Назад" aria-label="Назад">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                </button>

                <div class="date-current" title="Текущая дата">
                    {{ date }}
                </div>

                <button type="submit" name="navigate" value="next" class="date-nav-button" title="Вперед" aria-label="Вперед">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 18l6-6-6-6"></path>
                    </svg>
                </button>
            </div>

            <div class="form-group">
                <label>Сон (часов):</label>
                <input type="number" step="0.1" name="sleep_hours" value="{{ data.sleep_hours }}">
            </div>

            <div class="form-group">
                <label>Как спалось? (0-9):</label>
                <input type="range" name="sleep_quality" min="0" max="9" value="{{ data.sleep_quality|default(9) }}" oninput="this.nextElementSibling.value = this.value">
                <output>{{ data.sleep_quality|default(9) }}</output>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пульс (день):</label>
                    <input type="number" name="pulse_avg_day" value="{{ data.pulse_avg_day }}">
                </div>
                <div class="form-group">
                    <label>Пульс (сон):</label>
                    <input type="number" name="pulse_avg_sleep" value="{{ data.pulse_avg_sleep }}">
                </div>
            </div>

            <div class="form-group">
                <label>Шаги за день:</label>
                <input type="number" name="steps_total" value="{{ data.steps_total }}">
            </div>

            <div class="form-group">
                <label>Самочувствие (0-10):</label>
                <input type="range" name="well_being" min="0" max="10" value="{{ data.well_being|default(9) }}" oninput="this.nextElementSibling.value = this.value">
                <output>{{ data.well_being|default(9) }}</output>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="alco" value="true" {% if data.alco %}checked{% endif %}>
                    Был ли алкоголь?
                </label>
            </div>

            <div class="form-group">
                <label>Заметки:</label>
                <textarea name="notes" rows="5">{{ data.notes }}</textarea>
            </div>

            <button type="submit" name="navigate" value="save" class="btn-save">Сохранить</button>
        </form>
    </div>
</body>
</html>
